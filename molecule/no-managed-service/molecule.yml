---
platforms:
  - name: debian-13-no-managed-service
    groups:
      - vault_raft_servers
    image: dokken/debian-13
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    cgroup_parent: docker.slice

provisioner:
  playbooks:
    prepare: prepare.yml
  inventory:
    host_vars:
      debian-13-no-managed-service:
        vault_disable_api_health_check: true
        vault_install_hashi_repo: true
        vault_bin_path: /usr/bin
        vault_group: vault
        vault_agent_supervisor_mode: true
        vault_systemd_unit_path: /etc/systemd/system
