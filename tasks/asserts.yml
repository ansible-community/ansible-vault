---
# File: tasks/asserts.yml - Asserts for this role

- name: Check distribution compatibility
  ansible.builtin.fail:
    msg: "{{ ansible_distribution }} is not supported by this role"
  when:
    - ansible_distribution not in _vault_nix_distros
    - ansible_os_family != 'Windows'

- name: Fail if not a new release of Red Hat / CentOS
  ansible.builtin.fail:
    msg: "{{ ansible_distribution_version }} is not a supported version of {{ ansible_distribution }} for this role"
  when:
    - ansible_distribution in ['RedHat', 'CentOS']
    - ansible_distribution_version is version(7, '<')

- name: Fail if not a new release of Debian
  ansible.builtin.fail:
    msg: "{{ ansible_distribution_version }} is not a supported version of {{ ansible_distribution }} for this role"
  when:
    - ansible_distribution == "Debian"
    - (ansible_distribution_version != 'buster/sid') and (ansible_distribution_version is version(8.5, '<'))

- name: Fail if not a new release of FreeBSD
  ansible.builtin.fail:
    msg: "{{ ansible_distribution_version }} is not a supported version."
  when:
    - ansible_distribution == "FreeBSD"
    - ansible_distribution_version is version(10, '<')

- name: Fail if not a new release of Ubuntu
  ansible.builtin.fail:
    msg: "{{ ansible_distribution_version }} is not a supported version of {{ ansible_distribution }} for this role"
  when:
    - ansible_distribution == "Ubuntu"
    - ansible_distribution_version is version(13.04, '<')

- name: Check for vault_redirect_address usage
  ansible.builtin.debug:
    msg: "vault_redirect_address is deprecated. Check for vault_api_addr in the README."
  when: vault_redirect_address is defined

- name: Validate Vault seal type
  ansible.builtin.assert:
    that:
      - vault_seal_type | lower in ['shamir', 'transit', 'awskms', 'azurekeyvault', 'gcpckms', 'ocikms', 'pkcs11']
    fail_msg: "vault_seal_type must be: shamir, transit, awskms, azurekeyvault, gcpckms, ocikms, or pkcs11."

- name: Validate legacy Vault seal flags
  ansible.builtin.assert:
    that:
      - >-
        (vault_transit | bool | int)
        + (vault_awskms | bool | int)
        + (vault_azurekeyvault | bool | int)
        + (vault_gkms | bool | int)
        + (vault_ocikms | bool | int)
        + (vault_enterprise_hsm | bool | int) <= 1
    fail_msg: "Only one legacy Vault seal flag may be enabled. Use vault_seal_type to select one seal."

- name: Validate Vault seal type agrees with legacy flag
  ansible.builtin.assert:
    that:
      - >-
        vault_seal_type | lower == 'shamir'
        or not (vault_transit | bool or vault_awskms | bool or vault_azurekeyvault | bool
        or vault_gkms | bool or vault_ocikms | bool or vault_enterprise_hsm | bool)
        or (vault_seal_type | lower == 'transit' and vault_transit | bool)
        or (vault_seal_type | lower == 'awskms' and vault_awskms | bool)
        or (vault_seal_type | lower == 'azurekeyvault' and vault_azurekeyvault | bool)
        or (vault_seal_type | lower == 'gcpckms' and vault_gkms | bool)
        or (vault_seal_type | lower == 'ocikms' and vault_ocikms | bool)
        or (vault_seal_type | lower == 'pkcs11' and vault_enterprise_hsm | bool)
    fail_msg: "vault_seal_type conflicts with the enabled legacy Vault seal flag."

- name: Check if vault_transit_address and vault_transit_token has been specified
  ansible.builtin.assert:
    that:
      - vault_transit_address | length > 0
      - vault_transit_token | length > 0
    fail_msg: "vault_transit_address and vault_transit_token must both be defined for the Vault Transit seal."
  when:
    - vault_transit | bool
